name: craft_flutter_template
description: >-
  CRAFT — production-ready Flutter starter: clean architecture, Riverpod
  codegen, go_router, stub-first Firebase/RevenueCat/FCM modules, setup
  doctor, and a tested core. Run setup/setup.dart, then replace this
  description with your app's.
publish_to: "none"

# Semantic versioning (see CHANGELOG.md). Build number after `+`.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2
  logger: ^2.6.2
  dio: ^5.9.0
  internet_connection_checker_plus: ^2.9.1+2
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  flutter_dotenv: ^6.0.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0
  firebase_crashlytics: ^5.0.0
  firebase_analytics: ^12.0.0
  google_sign_in: ^7.2.0
  purchases_flutter: ^10.4.1
  firebase_messaging: ^16.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.10.5
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  # Generates l10n classes from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    # Readiness-checklist state, rendered read-only by the dev-only
    # Setup Status screen (edit the file itself to change state).
    - checklist.yaml
