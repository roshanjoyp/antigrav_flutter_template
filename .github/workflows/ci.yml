# CI for craft_flutter_template.
#
# Three jobs:
#   checks        — codegen freshness, format, analyze, custom_lint, tests
#   build-android — release APK + AAB (debug-key signed) to prove the
#                   template compiles on CI
#   build-ios     — unsigned iOS release build
#
# Generated files (*.g.dart) are committed, so `checks` regenerates them
# and fails if the committed output is stale.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  checks:
    name: Analyze, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated files are fresh
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code || {
            echo "::error::Generated files are stale. Run 'dart run build_runner build --delete-conflicting-outputs' and commit the result."
            exit 1
          }

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Custom lint (riverpod_lint)
        run: dart run custom_lint --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
